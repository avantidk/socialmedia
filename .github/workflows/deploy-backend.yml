name: Deploy backend (Supabase Edge Function)
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push secrets and deploy the function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
        run: |
          ref="${PROJECT_URL#https://}"; ref="${ref%%.*}"
          : > secrets.env
          for k in SITE_URL ENCRYPTION_KEY CRON_SECRET META_APP_ID META_APP_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET X_CLIENT_ID X_CLIENT_SECRET; do
            v="${!k}"; [ -n "$v" ] && echo "$k=$v" >> secrets.env
          done
          supabase secrets set --env-file secrets.env --project-ref "$ref" --yes
          rm secrets.env
          supabase functions deploy api --no-verify-jwt --project-ref "$ref" --yes
